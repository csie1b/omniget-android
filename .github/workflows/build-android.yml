name: Build Android (APK)

on:
  push:
    branches: [main, master, dev]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Rust Android target architecture'
        required: true
        default: 'aarch64-linux-android'
        type: choice
        options:
          - 'aarch64-linux-android'
          - 'armv7-linux-androideabi'
          - 'x86_64-linux-android'
          - 'all'
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Determine & Setup Android NDK
        run: |
          if [ -d "$ANDROID_HOME/ndk" ] && [ "$(ls -A $ANDROID_HOME/ndk)" ]; then
            NDK_DIR=$(find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          else
            echo "Installing NDK via sdkmanager..."
            yes | sdkmanager "ndk;27.0.12077973"
            NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "Found Android NDK at: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Initialize Tauri Android project
        run: CI=true pnpm tauri android init

      - name: Build Tauri Android App (APK)
        run: |
          TARGET="${{ github.event.inputs.target || 'aarch64-linux-android' }}"
          MODE="${{ github.event.inputs.build_mode || 'release' }}"
          
          FLAGS="--apk"
          if [ "$MODE" = "debug" ]; then
            FLAGS="$FLAGS --debug"
          fi

          if [ "$TARGET" != "all" ]; then
            FLAGS="$FLAGS --target $TARGET"
          fi

          echo "Running: pnpm tauri android build $FLAGS"
          pnpm tauri android build $FLAGS

      - name: Locate & Rename APKs
        run: |
          mkdir -p build-artifacts
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -exec cp {} build-artifacts/ \;
          ls -la build-artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omniget-android-apk
          path: build-artifacts/*.apk
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
