name: Build Android (APK)

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target architecture'
        required: true
        default: 'aarch64'
        type: choice
        options:
          - 'aarch64'
          - 'armv7'
          - 'x86_64'
          - 'all'
      build_mode:
        description: 'Build mode'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "Using Android SDK at: $ANDROID_SDK_ROOT"

          # Find sdkmanager binary
          SDKMANAGER=$(which sdkmanager 2>/dev/null || find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "Found sdkmanager: $SDKMANAGER"

          # Accept SDK licenses
          yes | "$SDKMANAGER" --licenses 2>/dev/null || true

          # Find or install NDK
          if [ -d "$ANDROID_SDK_ROOT/ndk" ] && [ "$(ls -A $ANDROID_SDK_ROOT/ndk 2>/dev/null)" ]; then
            NDK_DIR=$(find "$ANDROID_SDK_ROOT/ndk" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
            echo "Pre-installed NDK found at: $NDK_DIR"
          else
            echo "Installing NDK 27.0.12077973 via sdkmanager..."
            yes | "$SDKMANAGER" "ndk;27.0.12077973"
            NDK_DIR="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          fi

          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK configured: $NDK_DIR"

          # Create debug keystore in case needed for release signing
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi
            x86_64-linux-android
            i686-linux-android

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Initialize Tauri Android project
        run: pnpm tauri android init --ci --skip-targets-install

      - name: Configure Android Permissions & Signing
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Injecting Android permissions into $MANIFEST..."
            sed -i '/<uses-permission android:name="android.permission.INTERNET" \/>/a \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" \/>' "$MANIFEST"
          fi

          GRADLE_APP="src-tauri/gen/android/app/build.gradle.kts"
          if [ -f "$GRADLE_APP" ]; then
            echo "Configuring debug signing for release build in $GRADLE_APP..."
            sed -i 's/getByName("release") {/getByName("release") {\n            signingConfig = signingConfigs.getByName("debug")/' "$GRADLE_APP" || true
          fi

      - name: Build Tauri Android App (APK)
        run: |
          TARGET="${{ github.event.inputs.target || 'aarch64' }}"
          MODE="${{ github.event.inputs.build_mode || 'release' }}"
          FLAGS="--apk --ci"

          if [ "$MODE" = "debug" ]; then
            FLAGS="$FLAGS --debug"
          fi

          if [ "$TARGET" != "all" ]; then
            FLAGS="$FLAGS --target $TARGET"
          fi

          echo "Running: pnpm tauri android build $FLAGS"
          pnpm tauri android build $FLAGS

      - name: Locate, Sign & Package APKs
        run: |
          mkdir -p build-artifacts
          BUILD_TOOLS_DIR=$(find "$ANDROID_SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)

          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | while read -r apk_file; do
            echo "Found APK: $apk_file"
            base_name=$(basename "$apk_file")
            cp "$apk_file" "build-artifacts/$base_name"

            # If unsigned, sign with debug keystore
            if [[ "$base_name" == *"unsigned"* ]]; then
              signed_name="${base_name//-unsigned/}"
              echo "Signing $base_name -> $signed_name"
              "$BUILD_TOOLS_DIR/apksigner" sign --ks ~/.android/debug.keystore --ks-pass pass:android --out "build-artifacts/$signed_name" "build-artifacts/$base_name" || true
            fi
          done

          echo "--- Built Artifacts ---"
          ls -la build-artifacts/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: omniget-android-apk
          path: build-artifacts/*.apk
          retention-days: 14

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build-artifacts/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
